events {}

http {
    # Two backend instances. Round-robin by default — every request may land on
    # either one. This is exactly the setup that breaks an in-process "have we
    # already sent this?" check; our guard lives in Postgres, so it still holds.
    upstream crewlink_backend {
        server backend:8000;
        server backend2:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://crewlink_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Surface which instance served the request (handy for the demo).
            add_header X-Served-By $upstream_addr always;
        }
    }
}
